<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinyl Depot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="15" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.45"/>
        <circle cx="16" cy="16" r="6.5" fill="currentColor"/>
        <circle class="hole" cx="16" cy="16" r="1.6"/>
      </svg>
      <h1>Vinyl Depot</h1>
    </div>

    <nav class="view-nav" aria-label="Zobrazení">
      <button type="button" class="view-btn active" data-view="collection" aria-pressed="true">Moje sbírka</button>
      <button type="button" class="view-btn" data-view="search" aria-pressed="false">Hledat desku</button>
    </nav>

    <div class="search-panel" hidden>
      <form id="search-form">
        <div class="field-group">
          <label for="barcode-input">Čárový kód</label>
          <input id="barcode-input" type="text" inputmode="numeric" placeholder="např. 093624829904" autocomplete="off">

          <label for="artist-input">Interpret</label>
          <input id="artist-input" type="text" placeholder="např. Green Day" autocomplete="off">

          <label for="album-input">Album</label>
          <input id="album-input" type="text" placeholder="např. Dookie" autocomplete="off">
        </div>

        <button type="submit" class="search-btn">Hledat</button>
      </form>
    </div>
  </aside>


  <section class="content">
    <div class="collection-toolbar" id="collection-toolbar" hidden>
      <label for="sort-select">Řadit podle</label>
      <select id="sort-select">
        <option value="added_at">Přidáno</option>
        <option value="year">Roku</option>
        <option value="artist">Interpreta</option>
        <option value="title">Názvu</option>
      </select>
      <button type="button" id="sort-order-btn" aria-label="Obrátit řazení" data-order="desc">&darr;</button>
    </div>

    <p class="status" id="status" hidden></p>
    <div class="results" id="results" hidden></div>
    <button type="button" class="load-more-btn" id="load-more-btn" hidden>Načíst další</button>
    <div class="detail" id="detail" hidden></div>
  </section>
</div>

<script src="api.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
